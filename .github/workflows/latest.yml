name: Latest build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-build
  cancel-in-progress: false

jobs:
  windows-amd64:
    runs-on: ubuntu-latest
    env:
      TAG: latest
      ARTIFACT: STH.exe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -ldflags "-H=windowsgui" -trimpath -o "$ARTIFACT" .

      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          notes=$(printf 'Automated Windows x64 build.\n\nCommit: %s\nRef: %s\nRun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          # 2. Delete every release and its tag, including the previous one.
          gh release list --limit 100 --json tagName --jq '.[].tagName' |
            while IFS= read -r tag; do
              gh release delete "$tag" --yes --cleanup-tag
            done

          # 3. Recreate the tag at this commit.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

          # 4. Create the release for that tag.
          gh release create "$TAG" --title 'Latest build' --notes "$notes" --latest

          # 5. Attach the build.
          gh release upload "$TAG" "$ARTIFACT"
