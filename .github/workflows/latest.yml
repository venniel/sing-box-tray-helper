name: Latest build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-build
  cancel-in-progress: false

jobs:
  windows-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -ldflags "-H=windowsgui" -trimpath -o STH.exe .

      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          notes=$(printf 'Automated Windows x64 build.\n\nCommit: %s\nRef: %s\nRun: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest

          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title 'Latest build' --notes "$notes" --latest
          else
            gh release create latest --title 'Latest build' --notes "$notes" --latest
          fi

          gh release upload latest STH.exe --clobber

          # Drop assets from older builds so a renamed artifact leaves nothing behind.
          gh release view latest --json assets --jq '.assets[] | select(.name != "STH.exe") | .name' |
            while IFS= read -r asset; do
              gh release delete-asset latest "$asset" --yes
            done